name: Update GitHub Streak Stats

on:
  schedule:
    # Runs automatically every 4 hours to calculate latest contributions & streak
    - cron: "0 */4 * * *"
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: streak-stats
  cancel-in-progress: false

jobs:
  update-streak:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Generate Streak Stats SVG
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: "user=Sukhankar&theme=github-dark-blue&hide_border=true&short_numbers=true&ring=00F0FF&fire=FF4757&currStreakLabel=00F0FF&sideLabels=39FF14&dates=3B82F6"
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest changes
        run: git pull --rebase --autostash origin ${{ github.head_ref || github.ref_name }}

      - name: Commit and Push Streak SVG
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update streak stats SVG [skip ci]"
          file_pattern: "profile/streak.svg"
          branch: ${{ github.head_ref || github.ref_name }}
