<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <style>
      @keyframes borderGlow {
        0%, 100% { stroke: #00F0FF; stroke-width: 1.5px; filter: drop-shadow(0 0 4px #00F0FF); }
        50% { stroke: #39FF14; stroke-width: 2px; filter: drop-shadow(0 0 8px #39FF14); }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      .card-border {
        animation: borderGlow 4s infinite ease-in-out;
      }
      .cursor {
        animation: blink 1s infinite;
      }
      .floating-title {
        animation: float 3s infinite ease-in-out;
      }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="50%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#39FF14" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="800" height="200" rx="12" fill="url(#bg)" class="card-border" />

  <!-- Terminal Window Controls -->
  <circle cx="30" cy="25" r="6" fill="#FF4757" />
  <circle cx="50" cy="25" r="6" fill="#FFA500" />
  <circle cx="70" cy="25" r="6" fill="#39FF14" />
  <text x="92" y="29" fill="#8B949E" font-family="'Fira Code', 'Courier New', monospace" font-size="12">sukhankar@developer:~</text>
  <rect x="235" y="18" width="7" height="13" fill="#00F0FF" class="cursor" />

  <!-- Title -->
  <g class="floating-title">
    <text x="400" y="110" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-weight="900" font-size="44" fill="url(#text-grad)" filter="url(#glow)">
      Hi there, I'm Sukhankar! 👋
    </text>

    <!-- Subtitle -->
    <text x="400" y="155" text-anchor="middle" font-family="'Fira Code', monospace" font-weight="600" font-size="16" fill="#8B949E">
      Full-Stack Developer  •  Open Source Contributor  •  System Architect
    </text>
  </g>
</svg>
