<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="50%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#39FF14" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background with Animated Stroke via SMIL -->
  <rect width="800" height="200" rx="12" fill="url(#bg)" stroke="#00F0FF" stroke-width="1.5">
    <animate attributeName="stroke" values="#00F0FF; #39FF14; #3B82F6; #00F0FF" dur="5s" repeatCount="indefinite" />
  </rect>

  <!-- Terminal Controls -->
  <circle cx="30" cy="25" r="6" fill="#FF4757" />
  <circle cx="50" cy="25" r="6" fill="#FFA500" />
  <circle cx="70" cy="25" r="6" fill="#39FF14" />
  <text x="92" y="29" fill="#8B949E" font-family="'Fira Code', 'Courier New', monospace" font-size="12">sukhankar@developer:~</text>

  <!-- Blinking Cursor via SMIL -->
  <rect x="235" y="18" width="7" height="13" fill="#00F0FF">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
  </rect>

  <!-- Floating Title & Subtitle Group via SMIL -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4; 0,0" dur="3s" repeatCount="indefinite" />
    <text x="400" y="110" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-weight="900" font-size="44" fill="url(#text-grad)" filter="url(#glow)">
      Hi there, I'm Sukhankar! 👋
    </text>
    <text x="400" y="155" text-anchor="middle" font-family="'Fira Code', monospace" font-weight="600" font-size="16" fill="#8B949E">
      Full-Stack Developer  •  Open Source Contributor  •  System Architect
    </text>
  </g>
</svg>
