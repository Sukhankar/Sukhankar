      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.2" />
      <stop offset="30%" stop-color="#00F0FF" stop-opacity="1" />
      <stop offset="50%" stop-color="#39FF14" stop-opacity="1" />
      <stop offset="70%" stop-color="#3B82F6" stop-opacity="1" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  <rect width="800" height="4" rx="2" fill="url(#divider-grad)" opacity="0.7">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite" />
  </rect>
