<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 6" width="100%" height="6">
  <defs>
    <style>
      @keyframes gradientShift {
        0% { x1: 0%; x2: 100%; }
        50% { x1: 100%; x2: 0%; }
        100% { x1: 0%; x2: 100%; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.7; transform: scaleY(1); }
        50% { opacity: 1; transform: scaleY(1.3); }
      }
      .animated-divider {
        animation: pulseGlow 3s ease-in-out infinite;
        transform-origin: center;
      }
    </style>
    <linearGradient id="divider-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.2" />
      <stop offset="30%" stop-color="#00F0FF" stop-opacity="1" />
      <stop offset="50%" stop-color="#39FF14" stop-opacity="1" />
      <stop offset="70%" stop-color="#3B82F6" stop-opacity="1" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  <rect width="800" height="4" rx="2" fill="url(#divider-grad)" class="animated-divider" />
</svg>
